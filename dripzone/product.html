<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dripzone | Product Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .product-page-container { max-width: 1200px; margin: 120px auto; padding: 0 2rem; display: flex; gap: 4rem; flex-wrap: wrap; }
        .product-gallery { flex: 1; min-width: 300px; background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .product-info { flex: 1; min-width: 300px; display: flex; flex-direction: column; justify-content: center; }
        
        .product-gallery img { width: 100%; max-height: 500px; object-fit: contain; transform: scale(1); transition: transform 0.3s ease; }
        .product-gallery:hover img { transform: scale(1.05); }

        .product-title { font-size: 3rem; font-weight: 800; margin-bottom: 1rem; line-height: 1.1; }
        .product-price-large { font-size: 2rem; font-weight: 700; margin-bottom: 2rem; color: var(--accent); }
        .original-price-large { text-decoration: line-through; color: var(--secondary-text); opacity: 0.6; margin-right: 15px; font-size: 1.5rem; }
        
        .product-desc-large { font-size: 1.1rem; line-height: 1.8; color: #555; margin-bottom: 2rem; }
        
        .product-meta { display: flex; gap: 2rem; margin-bottom: 2rem; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 1.5rem 0; }
        .meta-item { display: flex; flex-direction: column; gap: 0.5rem; }
        .meta-label { font-size: 0.8rem; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .meta-value { font-size: 1.1rem; font-weight: 600; color: #111; }

        .add-to-cart-huge { width: 100%; padding: 1.5rem; font-size: 1.2rem; background: var(--primary-text); color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .add-to-cart-huge:hover { background: var(--accent); transform: translateY(-3px); box-shadow: 0 15px 25px rgba(0,0,0,0.15); }
        
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; color: #555; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .back-link:hover { color: var(--accent); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><span>Dripzone</span></div>
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="products.html">PRODUCTS</a></li>
            <li><a href="accessories.html">ACCESSORIES</a></li>
        </ul>
        <div class="nav-actions">
            <button id="userBtn"><i class="ph ph-user"></i></button>
            <button id="cartBtn" class="cart-btn"><i class="ph ph-shopping-bag"></i><span id="cartCount" class="cart-count">0</span></button>
            <button id="hamburgerBtn" class="hamburger" style="display:none;"><i class="ph ph-list"></i></button>
        </div>
    </nav>

    <div class="product-page-container fade-in" id="productContainer">
        <!-- Injected via JS -->
    </div>

    <!-- Modals copied over -->
    <div id="cartModal" class="cart-modal">
        <div class="cart-header"><h2>Your Bag</h2><button id="closeCartBtn"><i class="ph ph-x"></i></button></div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">Total: ₹<span id="cartTotalPrice">0</span></div>
            <button class="checkout-btn">Checkout</button>
        </div>
    </div>
    <div id="cartOverlay" class="overlay"></div>

    <script src="data/products.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            const container = document.getElementById('productContainer');

            const product = storeProducts.find(p => p.id === productId);

            if (!product) {
                container.innerHTML = `
                    <div style="text-align:center; width:100%; margin-top:50px;">
                        <i class="ph ph-warning-circle" style="font-size: 5rem; color: #ccc;"></i>
                        <h1 style="font-size:2rem; margin-top:1rem;">Product Not Found</h1>
                        <a href="products.html" class="back-link" style="margin-top:2rem;">Return to Shop</a>
                    </div>
                `;
                return;
            }

            document.title = `Dripzone | ${product.name}`;

            container.innerHTML = `
                <div style="width: 100%;">
                    <a href="javascript:history.back()" class="back-link"><i class="ph-bold ph-arrow-left"></i> Back</a>
                </div>
                <div class="product-gallery">
                    <img src="${product.image}" loading="lazy" class="smooth-img" onload="this.classList.add('loaded')" alt="${product.name}">
                </div>
                <div class="product-info">
                    <span style="display:inline-block; padding:0.5rem 1rem; background:#f0f0f0; border-radius:50px; font-size:0.8rem; font-weight:bold; letter-spacing:1px; margin-bottom:1rem; width:fit-content;">${product.category}</span>
                    <h1 class="product-title">${product.name}</h1>
                    <div class="product-price-large">
                        ${product.originalPrice ? `<span class="original-price-large">₹${product.originalPrice}</span>` : ''}₹${product.price}
                    </div>
                    
                    <p class="product-desc-large">${product.description || 'Premium thrifted aesthetic streetwear.'}</p>
                    
                    <div class="product-meta">
                        <div class="meta-item">
                            <span class="meta-label">Size</span>
                            <span class="meta-value">${product.size || 'One Size'}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Condition</span>
                            <span class="meta-value">Excellent (Thrifted)</span>
                        </div>
                    </div>

                    <button class="add-to-cart-huge" onclick="addToCart({id:${product.id}, name:'${product.name}', price:${product.price}, img:'${product.image}'})">
                        <i class="ph-bold ph-shopping-cart-simple"></i> Add to Bag
                    </button>
                    
                    <div style="margin-top:2rem; display:flex; gap:1rem; color:#888; font-size:0.9rem;">
                        <span style="display:flex; align-items:center; gap:5px;"><i class="ph-fill ph-truck"></i> Free Shipping</span>
                        <span style="display:flex; align-items:center; gap:5px;"><i class="ph-fill ph-shield-check"></i> Secure Checkout</span>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
