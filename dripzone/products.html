<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dripzone | Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .page-content { max-width: 1200px; margin: 120px auto; padding: 0 2rem; text-align: center; }
        .page-title { font-size: 3rem; font-weight: 800; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="ph-bold ph-drop"></i> <span>Dripzone</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="products.html" class="active">PRODUCTS</a></li>
            <li><a href="accessories.html">ACCESSORIES</a></li>
            <li><a href="collection.html">COLLECTION</a></li>
            <li><a href="about.html">ABOUT</a></li>
        </ul>
        <div class="nav-actions">
            <button id="userBtn"><i class="ph ph-user"></i></button>
            <button id="cartBtn" class="cart-btn"><i class="ph ph-shopping-bag"></i><span id="cartCount" class="cart-count">0</span></button>
            <button id="hamburgerBtn" class="hamburger" style="display:none;"><i class="ph ph-list"></i></button>
        </div>
    </nav>

    <div class="page-content fade-in-down">
        <h1 class="page-title">ALL THRIFT DROPS</h1>
        <p style="color: var(--secondary-text); margin-bottom: 3rem;">View our entire catalog right here.</p>
        
        <div style="display:flex; justify-content:center; gap:2rem; flex-wrap:wrap;">
            <!-- Dummy Grid -->
            <div class="secondary-product-card glass" style="flex-direction:column; height:auto; width:300px; padding:2rem; align-items:center;">
                <img src="assets/images/hero.png" style="width:100%; height:200px; object-fit:cover; border-radius:10px; margin-bottom:1rem;">
                <h3>Vintage Windbreaker</h3>
                <p style="margin:0.5rem 0 1rem;">$85</p>
                <button class="sec-add" style="width:100%" onclick="addToCart({id:1, name:'Vintage Windbreaker', price:85, img:'assets/images/hero.png'})">Add +</button>
            </div>
            <div class="secondary-product-card glass" style="flex-direction:column; height:auto; width:300px; padding:2rem; align-items:center;">
                <img src="assets/images/secondary.png" style="width:100%; height:200px; object-fit:contain; border-radius:10px; margin-bottom:1rem;">
                <h3>Top Selling Bag</h3>
                <p style="margin:0.5rem 0 1rem;">$45</p>
                <button class="sec-add" style="width:100%" onclick="addToCart({id:2, name:'Top Selling Bag', price:45, img:'assets/images/secondary.png'})">Add +</button>
            </div>
        </div>
    </div>

    <!-- Modals copied over for shared nav functionality -->
    <div id="cartModal" class="cart-modal">
        <div class="cart-header"><h2>Your Bag</h2><button id="closeCartBtn"><i class="ph ph-x"></i></button></div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">Total: $<span id="cartTotalPrice">0</span></div>
            <button class="checkout-btn">Checkout</button>
        </div>
    </div>
    <div id="cartOverlay" class="overlay"></div>

    <div id="authModal" class="auth-modal">
        <div class="auth-content glass">
            <button id="closeAuthBtn" class="close-auth"><i class="ph ph-x"></i></button>
            <div class="auth-tabs"><button id="tabLogin" class="active">Login</button><button id="tabSignup">Sign Up</button></div>
            <form id="loginForm" class="auth-form active"><input type="text" id="loginUsername" placeholder="Username" required><input type="password" id="loginPassword" placeholder="Password" required><button type="submit">Log In</button></form>
            <form id="signupForm" class="auth-form"><input type="text" id="signupUsername" placeholder="Username" required><input type="password" id="signupPassword" placeholder="Password" required><button type="submit">Create Account</button></form>
            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>
    <div id="authOverlay" class="overlay"></div>

    <script src="app.js"></script>
</body>
</html>
